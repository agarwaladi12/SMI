<!DOCTYPE html>
<html>
<head>
  <title>YouTube Metadata</title>
  <style>
    body { font-family: Arial, sans-serif; width: 280px; padding: 10px; }
    #error { color: red; }
    .label { font-weight: bold; }
  </style>
</head>
<body>
  <h3>YouTube Metadata</h3>
  <div id="loading">Loading...</div>
  <div id="error"></div>
  <div id="meta" style="display: none;">
    <div><span class="label">Title:</span> <span id="title"></span></div>
    <div><span class="label">URL:</span> <span id="url"></span></div>
    <div><span class="label">Type:</span> <span id="type"></span></div>
    <div><span class="label">Time:</span> <span id="time"></span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
